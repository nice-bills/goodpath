# Deploy Convex + Vercel production when changes land on main.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   CONVEX_DEPLOY_KEY   — Convex dashboard → Project → Settings → Deploy keys → Production
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — team id (Vercel project settings)
#   VERCEL_PROJECT_ID   — project id for `goodpath`
#
# See docs/VERCEL_DEPLOY.md § Continuous deployment

name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy-convex:
    name: Convex production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          unset CONVEX_DEPLOYMENT
          # GitHub secret paste often adds a trailing newline, which breaks Convex auth.
          CONVEX_DEPLOY_KEY="$(printf '%s' "$CONVEX_DEPLOY_KEY" | tr -d '[:space:]')"
          export CONVEX_DEPLOY_KEY
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY secret is missing."
            exit 1
          fi
          if [[ "$CONVEX_DEPLOY_KEY" != prod:* ]]; then
            echo "::error::CONVEX_DEPLOY_KEY must be a prod:… key from original-cod-804 (length ${#CONVEX_DEPLOY_KEY})."
            exit 1
          fi
          echo "Convex deploy key length: ${#CONVEX_DEPLOY_KEY}"
          npx convex deploy --yes --verbose

  deploy-vercel:
    name: Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "::error::VERCEL_ORG_ID secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::VERCEL_PROJECT_ID secret is missing"
            exit 1
          fi

      - name: Deploy to Vercel and update alias
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          OUTPUT="$(npx vercel@54.9.1 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>&1)"
          echo "$OUTPUT"
          DEPLOY_URL="$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9-]+-[a-z0-9-]+\.vercel\.app' | tail -1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not parse deployment URL from Vercel CLI output"
            exit 1
          fi
          npx vercel@54.9.1 alias set "$DEPLOY_URL" goodpath-app.vercel.app --token "${{ secrets.VERCEL_TOKEN }}"
